[wingpy_log]
# in NDJSON everything is written on a single line
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
CHARSET = UTF-8

# Search-time extraction
KV_MODE = json

# Precise ISO8601 timestamp configuration
# Must be the first element on the NDJSON string so
# that MAX_TIMESTAMP_LOOKAHEAD length does not skip
# the timestamp
TIME_PREFIX = ^\{"timestamp"\s*:\s*"
MAX_TIMESTAMP_LOOKAHEAD = 35
# example: "2026-08-24T13:36:10.107+02:00"
# ie date is 2026-08-24
# T is "T"
# time is 13.36.10 and subsecond is 107. JSON logs often used 3 digit milliseconds and not micro or nanoseconds.
# timezone is +02:00
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%:z

# CIM Normalization Layer
# Maps your JSON fields to standard CIM names
FIELDALIAS-wingpy_app = app_name AS app
FIELDALIAS-wingpy_action = status AS action

# Hardcoded evaluation fields for corporate compliance
EVAL-vendor = "Wingmen Solutions"
EVAL-product = "Wingpy"
