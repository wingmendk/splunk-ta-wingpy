name: Release TA-wingpy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate .spl
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      artifact_name: ${{ steps.capture_artifact.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derive release metadata
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate source metadata
        run: python tools/build_ta.py --validate-source --expected-tag "${GITHUB_REF_NAME}"

      - name: Build package
        run: python tools/build_ta.py --output-dir dist --expected-tag "${GITHUB_REF_NAME}"

      - name: Verify built package
        run: python tools/build_ta.py --verify-built --output-dir dist --expected-tag "${GITHUB_REF_NAME}"

      - name: Capture artifact name
        id: capture_artifact
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_NAME=$(basename dist/*.spl)
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ta-package
          path: dist/*.spl
          if-no-files-found: error

  github_release:
    name: Publish to GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ta-package
          path: dist

      - name: Upload asset to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/upload_github_release_asset.py \
            --repository wingmendk/TA-wingpy \
            --tag "${{ needs.build.outputs.tag }}" \
            --asset "dist/${{ needs.build.outputs.artifact_name }}"

  splunkbase_publish:
    name: Publish to Splunkbase
    runs-on: ubuntu-latest
    if: ${{ false }}
    needs:
      - build
      - github_release
    environment: splunkbase-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ta-package
          path: dist

      - name: Upload package to Splunkbase
        env:
          SPLUNKBASE_UPLOAD_URL: ${{ secrets.SPLUNKBASE_UPLOAD_URL }}
          SPLUNKBASE_API_TOKEN: ${{ secrets.SPLUNKBASE_API_TOKEN }}
          SPLUNKBASE_APP_ID: ${{ secrets.SPLUNKBASE_APP_ID }}
        run: |
          python tools/upload_splunkbase_release_asset.py \
            --asset "dist/${{ needs.build.outputs.artifact_name }}" \
            --tag "${{ needs.build.outputs.tag }}" \
            --version "${{ needs.build.outputs.version }}"
